name: WATSafe CI

on:
  push:
    branches: [main, feat/setup-readiness-safari-activity-filters]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Dart formatting
        run: |
          dart format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/features/home/home_screen.dart lib/features/devices/devices_screen.dart lib/features/activity/activity_screen.dart test/widget_test.dart
            git commit -m "Apply Dart formatting to browser UX updates"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Run standalone backend & CLI analyzer
        run: dart analyze tool/ backend/ lib/

      - name: Run automated tests
        run: flutter test
