name: Temporary Format Diagnostics

on:
  push:
    branches: [fix/pin-storage-ios-relay-ipad]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Print iPad widget test formatter diff
        run: |
          dart format test/widget_test.dart
          git diff -- test/widget_test.dart
