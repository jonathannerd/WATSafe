name: WATSafe Native Platform Builds

on:
  push:
    branches: [main, feat/setup-readiness-safari-activity-filters]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-android:
    name: Web & Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # Keep Gradle on Java 17: the project uses Gradle 8.14 and AGP 8.11.1.
      # Newer GitHub runner defaults (Java 25) are not supported by this wrapper.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Build Android debug APK
        run: flutter build apk --debug

  macos-ios:
    name: macOS & iOS build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --debug

      - name: Build iOS without code signing
        run: flutter build ios --no-codesign

  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --debug
